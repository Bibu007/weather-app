<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Oi&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
</head>
  <body>
    <div id="header">
      <div id="logo"><h1>Forecast</h1></div>
      <div id="search">
        <div class="input-wrapper">
            <input type="text" id="search" list="countries" placeholder="Start typing a place name...">
            <div class="error-msg">No results found</div>
        </div>
        <datalist id="countries"></datalist>
      </div>
      <div id="unit-selector">
        <button id="converter">C<sup>o</sup>/F<sup>o</sup></button>
      </div>
    </div>
    <div id="body-container">
      <div id="info-container">
        <div id="main-tile">
          <div id="left">
            <div id="place">London</div>
            <div id="main-high-low"><pre>H:31 | L:25</pre></div>
          </div>
          <div id="right">
            <div id="temp">24<sup>o</div>
            <div id="desc">Sunny</div>
          </div>
        </div>
        <div id="tiles-grid">
            <div class="tile"><div><h3 class="tile-title">FEELS LIKE</h3></div><div id="feels">32<sup>o</div></div>
            <div class="tile"><div><h3 class="tile-title">UV INDEX</h3></div><div id="uv">4</div></div>
            <div class="tile"><div><h3 class="tile-title">PRECIPITATION(mm)</h3></div><div id="prec">20</div></div>
            <div class="tile"><div><h3 class="tile-title">HUMIDITY</h3></div><div id="hum">80%</div></div>
            <div class="tile"><div><h3 class="tile-title">VISIBILITY(km)</h3></div><div id="vis">25</div></div>
            <div class="tile"><div><h3 class="tile-title">WIND(km/h)</h3></div><div id="wind">6</div></div>
        </div>
      </div>
      <div id="forecast-container">
      </div>
    </div>
    <div id="full-page-loader" class="loader-overlay hidden" aria-live="assertive" aria-label="Loading">
    <div class="spinner"></div>
    <p class="loader-text">Loading, please wait...</p>
    </div>
  </body>
</html>
